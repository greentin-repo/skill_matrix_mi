<div class="table-block">
    <div class="table-responsive tableFixHead">
        <table matSort (matSortChange)="sortData($event)" [matSortActive]="sort.active"
            [matSortDirection]="sort.direction" class="table table-bordered">
            <thead>
                <tr>
                    <th mat-sort-header="BranchName">Plant</th>
                    <th mat-sort-header="DeptName">Department</th>
                    <th mat-sort-header="LineName">Cell/Line</th>
                    <th mat-sort-header="Plan">Plan</th>
                    <th mat-sort-header="LevelName">Level</th>
                    <th mat-sort-header="Actual">Actual</th>
                    <th mat-sort-header="PassCount">Pass </th>
                    <th mat-sort-header="FailCount">Fail</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let x of reportData.employeeWisePlan">
                    <td>{{x.branchName}}</td>
                    <td>{{x.deptName}}</td>
                    <td>{{x.lineName}}</td>
                    <td>{{x.planCount}}</td>
                    <td>{{x.levelName}}</td>
                    <td>{{x.actulCount}}</td>
                    <td>{{x.passCount}}</td>
                    <td>{{x.failCount}}</td>
                </tr>
                <tr *ngIf="reportData.employeeWisePlan == null || reportData.employeeWisePlan.length == 0">
                    <td colspan="5" class="text-center no-record-found">
                        Data Not Found
                        <!-- <div class="dataNotAvailable"></div> -->
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <!-- <app-pagination [staticPagination]="staticPagination" (paginationData)="loadMore($event)"></app-pagination> -->

</div>
