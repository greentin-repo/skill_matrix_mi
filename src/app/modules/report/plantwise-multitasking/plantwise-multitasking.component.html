<div class="table-block">
    <div class="table-responsive tableFixHead">
        <table matSort (matSortChange)="sortData($event)" [matSortActive]="sort.active"
            [matSortDirection]="sort.direction" matSortDisableClear class="table table-bordered">
            <thead>
                <tr>
                    <th mat-sort-header="BranchName">Plant</th>
                    <!-- <th mat-sort-header="DeptName">Department</th> -->
                    <th mat-sort-header="TotalEmp">Total Employee</th>
                    <th mat-sort-header="EmpMultiskillingCount">Employee Multiskilling Count</th>
                    <th mat-sort-header="MultiskillingPercentage">Multiskilling %</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let x of reportData.plantWiseMultitasking">
                    <td>{{x.branchName}}</td>
                    <!-- <td>{{x.deptName}}</td> -->
                    <td>{{x.TotalEmp}}</td>
                    <td>{{x.EmpMultiskillingCount}}</td>
                    <td>{{x.MultiskillingPercentage}}</td>
                </tr>
                <tr *ngIf="reportData.plantWiseMultitasking == null || reportData.plantWiseMultitasking.length == 0">
                    <td colspan="4" class="text-center no-record-found">
                        Data Not Found
                        <!-- <div class="dataNotAvailable"></div> -->
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <!-- <app-pagination [staticPagination]="staticPagination" (paginationData)="loadMore($event)"></app-pagination> -->
</div>
