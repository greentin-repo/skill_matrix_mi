<div class="modal-content">
    <div class="modal-header">
        <h4 class="modal-title popup-header-txt" id="myModalLabel2">{{this.OJTRegiData.title}}</h4>
        <button type="button" class="close" aria-label="Close" (click)="closeModal()"> <span
                aria-hidden="true">&times;</span> </button>
    </div>
    <div class="modal-body" style="padding: 0px;">
        <div class="row m-0 padding-tb">
            <div class="col-md-12">
                <div class="row">
                    <div class="col-3 insideLabel">
                        <label for="moduleId" class="col-form-label p-0">Plant&nbsp;<span
                                class="astrik">*</span></label>
                        <div class>
                            <ng-multiselect-dropdown name="selectedModuleId"
                                class="custom-multiSelection customWidthForInter assessmentdropDown addLabelInside"
                                [placeholder]="'Select Plant'" [settings]="SingleDropdownSettings"
                                [data]="branchAccessList" (onSelect)="onChangeBranch($event)"
                                (onDeSelect)="onChange(false,'plant')" [(ngModel)]="ojtPlan.branch"
                                [disabled]="ojtPlanData.isEditable && ojtPlanData.planId > 0">
                            </ng-multiselect-dropdown>
                        </div>
                    </div>
                    <div class="col-3 insideLabel p-l-5 p-r-5">
                        <label for="dept" class="col-form-label p-0">Department&nbsp;<span
                                class="astrik">*</span></label>
                        <div class>
                            <ng-multiselect-dropdown name="dept"
                                class="custom-multiSelection customWidthForInter assessmentdropDown addLabelInside"
                                [placeholder]="'Select Department'" [settings]="SingleDropdownSettings"
                                (onSelect)="onChangeDept($event)" (onDeSelect)="onChangeDept(false)" [data]="deptList"
                                [(ngModel)]="ojtPlan.dept"
                                [disabled]="ojtPlanData.isEditable && ojtPlanData.planId > 0">
                            </ng-multiselect-dropdown>
                        </div>
                    </div>
                    <div class="col-3 insideLabel">
                        <label for="moduleId" class="col-form-label p-0">Cell/Line&nbsp;<span
                                class="astrik">*</span></label>
                        <div class>
                            <ng-multiselect-dropdown name="selectedModuleId"
                                class="custom-multiSelection customWidthForInter assessmentdropDown addLabelInside"
                                [placeholder]="'Select Cell/Line'" [settings]="SingleDropdownSettings"
                                (onSelect)="onChangeLine($event)" [data]="cellList" [(ngModel)]="ojtPlan.cell"
                                [disabled]="ojtPlanData.isEditable && ojtPlanData.planId > 0">
                            </ng-multiselect-dropdown>
                        </div>
                    </div>
                    <div class="col-3 insideLabel">
                        <label for="moduleId" class="col-form-label p-0">Trainer&nbsp;<span
                                class="astrik">*</span></label>
                        <div class>
                            <ng-multiselect-dropdown name="selectedModuleId"
                                class="custom-multiSelection customWidthForInter assessmentdropDown addLabelInside"
                                [placeholder]="'Select Trainer'" [settings]="SingleDropdownSettings"
                                [data]="getSortFunction(userTypeList,'trainer')" [(ngModel)]="ojtPlan.trainer">
                            </ng-multiselect-dropdown>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="table-block skill-table">
            <div class="table-responsive tableFixHead">
                <table class="table table-bordered">
                    <thead>
                        <tr>
                            <ng-container *ngFor="let x of empDetailsList.columns">
                                <th class="fixedColumn empNameCol" *ngIf="x.field === 'empName'">
                                    {{ getCombinedHeader()}}
                                </th>
                                <th style="text-align: center;"
                                    *ngIf="x.field !== 'empLevel' && x.field !== 'empName' && x.field !== 'empId'">
                                    {{ getHeadingWithLevel(x.field, x.heading)
                                    }}
                                </th>
                            </ng-container>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- <tr *ngFor="let row of empDetailsList.tableData">
                            <td class="actionTd fixedColumn">{{ row.cmpyEmpId }}</td>
                            <td class="actionTd fixedColumn" style="text-align: left;">
                                {{ row.empName }} (<span>{{ row.empLevel }}</span>)
                            </td>
                            <ng-container *ngFor="let column of empDetailsList.columns">
                                <ng-container
                                    *ngIf="column.field !== 'empId' && column.field !== 'cmpyEmpId' && column.field !== 'empName' && column.field !== 'empLevel' && column.field !== 'workstationId'">
                                    <td>
                                        <div class="checkbox-block form-check">
                                            Bind the checked state and the change event to the checkbox
                                            <input class="form-check-input" type="checkbox"
                                                [checked]="isChecked(row, column.field)"
                                                (change)="onCheckboxChange(row, column.field)"
                                                [id]="'checkbox' + row.empId + '_' + column.field">

                                            <label [for]="'checkbox' + row.empId + '_' + column.field"></label>
                                            Use property binding to set for attribute
                                        </div>
                                    </td>
                                </ng-container>
                            </ng-container>
                        </tr> -->
                        <tr *ngFor="let row of empDetailsList.tableData">
                            <td class="actionTd fixedColumn">{{ row.cmpyEmpId }}</td>
                            <td class="actionTd fixedColumn" style="text-align: left;">
                                {{row.empName}}
                            </td>
                            <ng-container *ngFor="let column of empDetailsList.columns">
                                <ng-container
                                    *ngIf="column.field !== 'empId' && column.field !== 'cmpyEmpId' && column.field !== 'empName'">
                                    <ng-container
                                        *ngIf="!isObjectEmpty(isChecked(row,column.field)) && isChecked(row,column.field).status != constant.ELIGIBLE">
                                        <td class="empSkillLevelTd text-center"
                                            [ngClass]="(!isObjectEmpty(isChecked(row, column.field))) ? isChecked(row, column.field).status : ''">
                                            <label class="form-check-label" for="">
                                                {{!isObjectEmpty(isChecked(row, column.field)) ? isChecked(row,
                                                column.field).level : ''}}
                                            </label>
                                        </td>
                                    </ng-container>
                                    <ng-container
                                        *ngIf="!isObjectEmpty(isChecked(row, column.field)) && isChecked(row,column.field).status == constant.ELIGIBLE">
                                        <td class="empSkillLevelTd"
                                            (ngClick)="column.isChecked = (column.isChecked) ? false : true">
                                            <!-- <div class="checkbox-block form-check">
                                                <input type="checkbox" class="form-check-input"
                                                    id="{{'checkbox' + row.empId + '_' + column.field}}"
                                                    name="emp{{row.empId + '_' + column.field}}" />
                                                <label class="form-check-label" for=""></label>
                                            </div> -->
                                            <div class="checkbox-block form-check">
                                                <input class="form-check-input" type="checkbox"
                                                    (change)="onCheckboxChange(row, column.field)"
                                                    [id]="'checkbox' + row.empId + '_' + column.field">
                                                <label [for]="'checkbox' + row.empId + '_' + column.field"></label>
                                            </div>
                                        </td>
                                    </ng-container>
                                    <!-- <td >
                                        <div class="checkbox-block form-check">
                                            <label class="form-check-label" for="">
                                                {{isChecked(row, column.field)}}
                                            </label> -->
                                    <!-- <div *ngIf="isChecked(row, column.field) == 2">2</div>
                                            <div *ngIf="isChecked(row, column.field) == 3">3</div> -->
                                    <!-- Bind the checked state and the change event to the checkbox -->
                                    <!-- <div>{{isChecked(row, column.field)}}</div> -->
                                    <!-- <div>{{row.empId}} {{column.field}}</div> -->
                                    <!-- <div>{{onCheckboxChange(row, column.field)}}</div>
                                            <div>{{onCheckboxChange(row, column.field)}}</div> -->
                                    <!-- <input class="form-check-input" type="checkbox"
                                                [checked]="isChecked(row, column.field)"
                                                (change)="onCheckboxChange(row, column.field)"
                                                [(ngModel)]="checkboxStates[row.empId + '_' + column.field]"
                                                [id]="'checkbox' + row.empId + '_' + column.field"> -->
                                    <!-- <input class="form-check-input" type="checkbox"
                                                [checked]="isChecked(row, column.field)"
                                                (change)="onCheckboxChange(row, column.field)"
                                                [id]="'checkbox' + row.empId + '_' + column.field">
                                            <label [for]="'checkbox' + row.empId + '_' + column.field"></label> -->
                                    <!-- Use property binding to set for attribute -->
                                    <!-- </div>
                                    </td> -->
                                </ng-container>
                            </ng-container>
                        </tr>

                    </tbody>
                </table>
            </div>
        </div>
        <div class="modal-footer">
            <div class="row">
                <div class="col-sm-12 footer-buttons">
                    <button style="margin-right: 10px;" type="submit" class="btn submitBtn m-l-5" aria-label="Submit"
                        [disabled]="submitLoader" (click)="submitOJTRegi('SAVE')">
                        <span *ngIf="isSubmitSpinner" class="spinner-grow spinner-grow-sm" role="status"></span>
                        <span *ngIf="isSubmitSpinner" class="load-text">
                            Loading...</span>
                        <span *ngIf="!isSubmitSpinner" class="btn-text">Save</span>
                    </button>
                    <button type="button" class="btn cancelBtn m-l-5" aria-label="Close" [disabled]="submitLoader"
                        (click)="closeModal()">Cancel
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
