<div class="row m-0">
    <div class="col-8 m-auto">
        <app-topBar title="Certificates"></app-topBar>
    </div>
    <div class="col-3 m-auto">
        <!-- <app-loginInfo></app-loginInfo> -->

    </div>
    <div class="col-1 p-0 m-auto text-center">
        <!-- <button class="btn btn-default filter-btn" title="Filter" (click)="filterModalOpen(FilterModal)" [(ngModel)]="searchDet.searchInput">
            <i class="fa fa-filter filter-icon" aria-hidden="true"></i> 
        </button> -->
        <div class="btn-filter-wrap">
            <button class="btn btn-default filter-btn" [ngClass]="{'applied' : searchDet.filterFlag}" title="Filter"
                (click)="filterModalOpen(FilterModal)">
                <i class="fa fa-filter filter-icon" aria-hidden="true"></i>
            </button>
            <div class="btn-clear-filter" *ngIf="searchDet.filterFlag" (click)="removeFilter();">x</div>
            <div class="lbl-filter-applied" *ngIf="searchDet.filterFlag">Filter Applied</div>
        </div>

    </div>
</div>

<div class="homepage-block bg-Transperant p-l-15 p-r-15">
   
        <div class=" extraContent row m-0">
            <div class="col-4">
                <!-- <div class="p-l-0 p-r-5" [ngClass]="(searchDet.filterFlag)?'col-6':'col-12'"> -->
                <div class="form-group has-search">
                    <span *ngIf="!searchDet.searchData" class="fa fa-search form-control-feedback"
                        (click)="getSearchList(true)"></span>
                    <span *ngIf="searchDet.searchData" class="fa fa-times-circle form-control-clear"
                        (click)="getSearchList(false)"></span>
                    <input type="text" class="form-control" name="searchInput"
                        placeholder="Search by name or workstation" [(ngModel)]="searchDet.searchInput"
                        autocomplete="off" (keyup)="$event.keyCode == 13 ? getSearchList(true) : ''">
                </div>
                <!-- <div class="col-6 p-r-5 p-l-5" *ngIf="searchDet.filterFlag">
                        <div class="filterDiv">
                            <button class="clearFilter" (click)="removeFilter()">Clear filter</button>
                            &nbsp;
                            <span style="color: green;font-size: 12px; font-weight: 500;">Filter
                                Applied</span>
                        </div>
                    </div> -->
            </div>
            <div class="col-4">
            </div>
            <div class="col-4"></div>
        </div>
 
    <div class="table-block">
        <div class="table-responsive tableFixHead">
            <table class="table" matSort (matSortChange)="sortData($event)">
                <thead>
                    <tr>
                        <th mat-sort-header="BranchName">Plant</th>
                        <th mat-sort-header="DeptName">Department</th>
                        <th mat-sort-header="EmpId">Emp. ID</th>
                        <th mat-sort-header="EmpName">Emp.Name</th>
                        <th mat-sort-header="Workstation">WorkStation</th>
                        <th mat-sort-header="LevelName">Level</th>
                        <th mat-sort-header="Status">Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let data of certificateList">
                        <td>{{data.branchName }}</td>
                        <td>{{data.deptName }}</td>
                        <!-- <td>{{x.lineName}}</td> -->
                        <td>{{data.companyEmpId }}</td>
                        <td>{{data.empName }}</td>
                        <td>{{data.workstationName }}</td>
                        <td>{{data.levelName }}</td>
                        <td [ngClass]="{'completed':data.status == 'COMPLETED','pending':data.status == 'PENDING'}">{{data.status}}</td>
                        <td class="actionTd fixedColumn">
                            <a (click)="previewCertificate(data,certificateModal)"
                                style="color:#7044CD;cursor: pointer"><i class="fa fa-eye viewIcon"></i></a>
                            &nbsp; &nbsp;
                            <!-- <a style="color:#7044CD;cursor: pointer;" href="{{data.certificatePath}}" download
                                target="_blank"><i class="fa fa-download"></i></a> -->

                        </td>
                    </tr>
                    <tr *ngIf="(certificateList == null || certificateList.length == 0)">
                        <td colspan="11" class="text-center no-record-found" *ngIf="!listLoading">
                            Data Not Found
                        </td>
                        <td colspan="11" class="text-center loading-div" *ngIf="listLoading">
                            <app-loading></app-loading>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <app-pagination [staticPagination]="staticPagination" (paginationData)="loadMore($event)">
    </app-pagination>
</div>

<ng-template #FilterModal let-c="close" let-d="dismiss">
    <div class="modal-header">
        <h4 class="modal-title popup-header-txt" id="myModalLabel2">Filter</h4>
        <button type="button" class="close" aria-label="Close" (click)="d('Cross click')">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    <form [formGroup]="filterData" (ngSubmit)="submitFilterForm(filterData)" autocomplete="off"
        class="needs-validation">
        <div class="modal-body p-2" style="height: calc(100vh - 14vh);">
            <perfect-scrollbar>
                <div class="row m-b-0">
                    <label for="branchId" class="col-sm-12 col-form-label filter-label p-b-0">Plant</label>
                    <div class="col-sm-12">
                        <ng-multiselect-dropdown name="branchId" id="branchId"
                            class="custom-multiSelection customWidthForInter assessmentdropDown"
                            [placeholder]="'Select Plant'" [settings]="SingleDropdownSettings"
                            [data]="getSortFunction(plantList,'plant')" formControlName="branchId"
                            [(ngModel)]="searchDet.branch" (onSelect)="onChange($event,'plant')"
                            (onDeSelect)="onChange(false,'plant')">
                        </ng-multiselect-dropdown>
                        <div *ngIf="submitAttempted && filterData.controls['branchId'].invalid && (filterData.controls['branchId'].touched || filterData.controls['branchId'].dirty)"
                            class="custom-errorMsg" style="padding-left: 15px;">
                            <div *ngIf="filterData.controls['branchId'].errors.required">
                                Please select plant
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row m-b-0">
                    <label for="deptIds" class="col-sm-12 col-form-label filter-label p-b-0">Department</label>
                    <div class="col-sm-12">
                        <ng-multiselect-dropdown name="deptIds" id="deptIds"
                            class="custom-multiSelection assessmentdropDown customWidthForRport"
                            [placeholder]="'Select Department'" [settings]="multipleDropdownSettings"
                            [data]="getSortFunction(searchDet.departmentList,'dept')" formControlName="deptIds"
                            [(ngModel)]="searchDet.deptIds" (onSelect)="onChange($event,'dept')"
                            (onDeSelect)="onChange(false,'dept')" (onSelectAll)="onChangeAll($event,'dept')"
                            (onDeSelectAll)="onChangeAll($event,'dept')">
                        </ng-multiselect-dropdown>
                        <div *ngIf="submitAttempted && filterData.controls['deptIds'].invalid && (filterData.controls['deptIds'].touched || filterData.controls['deptIds'].dirty)"
                            class="custom-errorMsg" style="padding-left: 15px;">
                            <div *ngIf="filterData.controls['deptIds'].errors.required">
                                Please select department
                            </div>
                        </div>
                    </div>
                </div>
            </perfect-scrollbar>
        </div>
        <div class="modal-footer footerBlock text-right">
            <button class="btn submitBtn event-btn" type="submit">
                <span *ngIf="submitSpinner" class="spinner-grow spinner-grow-sm" role="status"></span>
                <span *ngIf="submitSpinner" class="load-text"> Loading...</span>
                <span *ngIf="!submitSpinner" class="btn-text">Apply Filter</span>
            </button>
            <!-- <button type="button" class="btn cancelBtn" aria-label="Close" (click)="d('Cross click')">Cancel -->
            <!-- </button> -->
        </div>
    </form>
</ng-template>

<ng-template #certificateModal let-c="close">
    <app-viewCertificate [close]="c" [selectedDet]="selectedRecForModal"></app-viewCertificate>
</ng-template>
