<div class="homepage-block bg-Transperant p-l-15 p-r-15">
    <div>
        <app-loading *ngIf="isLevelListLoading" style="position: absolute;top: 50%;left: 50%;">Please Wait...</app-loading>
        <div class="table-block">
            <div class="table-responsive tableFixHead">
                <table class="table">
                    <thead>
                        <tr>
                            <th style="width: 8%;">Sr. No</th>
                            <th>Level</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let x of refMasterCertificateLevel; let i = index">
                            <td style="width: 10%;">{{i + 1}}</td>
                            <td>{{x.levelName}}</td>
                        </tr>                        
                        <tr *ngIf="(refMasterCertificateLevel == null || refMasterCertificateLevel.length == 0)">
                            <td colspan="2" class="text-center no-record-found"><!-- *ngIf="!listLoading" -->
                                Data not found
                            </td>
                            <td colspan="2" class="text-center loading-div" *ngIf="listLoading">
                                <app-loading></app-loading>
                            </td>
                        </tr> 
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
