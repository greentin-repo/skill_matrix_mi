<div class="row m-0">
    <div class="col-9 m-auto">
        <app-topBar title="Certificate"></app-topBar>
    </div>
    <div class="col-3 m-auto">
        <!-- <app-loginInfo></app-loginInfo> -->
    </div>
</div>
<div class="homepage-block bg-Transperant p-l-15 p-r-15">
    <div class="extraContent">
        <div class="row m-0">
            <div class="p-l-0 p-r-5 col-4">
                <div class="row m-0">
                    <div class="p-l-0 p-r-5" [ngClass]="(searchDet.filterFlag)?'col-6':'col-12'">
                        <div class="form-group has-search">
                            <span *ngIf="!searchDet.searchData" class="fa fa-search form-control-feedback" (click)="getSearchList(true)"></span>
                            <span *ngIf="searchDet.searchData" class="fa fa-times-circle form-control-clear"
                                (click)="getSearchList(false)"></span>
                            <input type="text" class="form-control" name="searchInput"
                                placeholder="Search by level or status" [(ngModel)]="searchDet.searchInput"
                                (keyup)="$event.keyCode == 13 ? getSearchList(true) : ''" autocomplete="off" />
                        </div>
                    </div>
                    <div class="col-6 p-r-5 p-l-5" *ngIf="searchDet.filterFlag">
                        <div class="filterDiv">
                            <button class="clearFilter" (click)="removeFilter()">Clear filter</button>
                            &nbsp;
                            <span style="color: green;font-size: 12px; font-weight: 500;">Filter
                                applied</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-4 p-r-5 p-l-5 form-group">

            </div>
            <div class="col-4 p-0">
                <div class="addRegDiv" style="bottom: -0.1rem;">
                    <button class="btn addRegBtn m-0" type="button" (click)="addCertificate(certificateAddModal)"><i
                            class="fa fa-plus m-r-10"></i>Add Certificate</button>
                </div>
            </div>
        </div>
    </div>
    <div class="table-block">
        <div class="table-responsive tableFixHead">
            <table class="table" matSort (matSortChange)="sortData($event)">
                <thead>
                    <tr>
                        <th  mat-sort-header="BranchName">Plant</th>
                        <th mat-sort-header="SkillLevelName" class="fixedColumn">Level</th>
                        <!-- <th>Certificate Name</th> -->
                        <th mat-sort-header="Status">Status</th>
                        <th class="actionTh fixedColumn">Action</th>
                    </tr>
                </thead>
                <tbody>
                   
                    <tr *ngFor="let data of certificateList">
                        <td>{{data.branchName}}</td>
                        <td>{{data.skillLevelName || 'NA'}}</td>
                        <!-- <td>{{data.certificateName || 'NA'}}</td> -->
                        <td>{{data.status || 'NA'}}</td>
                        <td class="actionTd fixedColumn text-left">
                            <a class="btn btn-sm editIcon" href="{{data.certificatePath}}" download target="_blank"
                                *ngIf="data.certificatePath"><i class="fa fa-download"></i></a>&nbsp;
                            <i class="fa fa-eye editIcon" (click)="previewCertificate(data,certificateModalForSettings)"
                                *ngIf="data.certificatePath"></i>
                            &nbsp; &nbsp;
                            <!-- <i class="fa fa-edit editIcon" (click)="editCertificate(InterventionModal, inter)"></i> -->
                            <i class="fas fa-trash-alt deleteIcon" (click)="deleteCertificate(data)"></i>&nbsp; &nbsp;
                        </td>
                    </tr>
                    <tr *ngIf="(certificateList == null || certificateList.length == 0)">
                        <td colspan="11" class="text-center no-record-found" *ngIf="!listLoading">
                            Data not found
                        </td>
                        <td colspan="11" class="text-center loading-div" *ngIf="listLoading">
                            <app-loading></app-loading>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <app-pagination [staticPagination]="staticPagination" (paginationData)="loadMore($event)">
        </app-pagination>
    </div>
</div>
<ng-template #certificateAddModal let-c="close" let-d="dismiss">
    <div class="modal-header">
        <h4 class="modal-title popup-header-txt" id="myModalLabel2">Add Certificate</h4>
        <button type="button" class="close" aria-label="Close" (click)="closeCertificateModal()">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    <div class="modal-body p-l-15 p-r-15">
        <form autocomplete="off" class="needs-validation" [formGroup]="formdata"
            (ngSubmit)="submitCertificate(formdata)">
            <div style="border-bottom: 1px solid lightgray;">
                <div class="row">
                    <div class="col-3">
                        <label for="certificateTyapeId" class="col-form-label">Skill-Level</label> &nbsp;<span
                            style="color: red;">*</span>
                        <ng-multiselect-dropdown class="custom-multiSelection customWidthForInter"
                            id="certificateTypeId" [placeholder]="'Select skill level'"
                            [settings]="singleDropdownSettings" [data]="LevelList" formControlName="skillLevel"
                            name="skillLevel">
                        </ng-multiselect-dropdown>
                        <div *ngIf="formdata.controls['skillLevel'].invalid && (formdata.controls['skillLevel'].touched || formdata.controls['skillLevel'].dirty)"
                            class="custom-errorMsg" style="padding-left: 15px;">
                            <div *ngIf="formdata.controls['skillLevel'].errors.required">
                                Please select skill-level
                            </div>
                        </div>
                    </div>
                    <div class="col-3">
                        <label for="branch" class="col-form-label">Plant</label> &nbsp;<span
                            style="color: red;">*</span>
                        <ng-multiselect-dropdown class="custom-multiSelection customWidthForInter"
                             [placeholder]="'Select plant'" formControlName="branch" name="branch"
                            [settings]="singleDropdownSettings" [data]="getSortFunction(branchAccessList,'dept')"
                            name="branch">
                        </ng-multiselect-dropdown>
                        <div *ngIf="formdata.controls['branch'].invalid && (formdata.controls['branch'].touched || formdata.controls['branch'].dirty)"
                            class="custom-errorMsg" style="padding-left: 15px;">
                            <div *ngIf="formdata.controls['branch'].errors.required">
                                Please select plant
                            </div>
                        </div>
                    </div>
                    <div class="col-4">
                        <label for="certificate" class="col-form-label">Certificate</label> &nbsp;<span
                            style="color: red;">*</span>
                        <small style="color:red">&nbsp;&nbsp;[Only jpg or Png]</small>
                        <div class="input-group">
                            <div class="custom-file">
                                <input type="file" #certImage class="custom-file-input"
                                    (change)="handleFileInput($event.target.files)" id="inputGroupFile04"
                                    formControlName="certificate" accept="image/*" required>
                                <label class="custom-file-label" *ngIf="!fileSelected" for="inputGroupFile04">Choose
                                    file</label>
                                <label class="custom-file-label" *ngIf="fileSelected" for="inputGroupFile04"
                                    style="color: green;">File
                                    selected</label>
                            </div>
                            <div *ngIf="certImage.files.length === 0 && formdata.controls['certificate'].dirty"
                                class="custom-errorMsg">
                                <!-- *ngIf="formdata.controls['certificate'].invalid && (formdata.controls['certificate'].touched || formdata.controls['certificate'].dirty)" -->
                                <div>
                                    <!-- *ngIf="formdata.controls['certificate'].errors.required" -->
                                    Please choose file
                                </div>
                            </div>
                            <div class="input-group-append" *ngIf="fileSelected">
                                <button type="button" class="btn btn-outline-secondary" [disabled]="isUploadSpinner"
                                    (click)="resetFile(certImage)"><i class="fa fa-times"></i></button>
                            </div>
                        </div>
                    </div>
                    <div class="col-2 text-right p-t-35 p-b-10">
                        <button type="submit" class="btn submitBtn" [disabled]="isUploadSpinner">
                            <span *ngIf="isUploadSpinner" class="spinner-grow spinner-grow-sm" role="status"></span>
                            <span *ngIf="isUploadSpinner" class="load-text"> Loading...</span>
                            <span *ngIf="!isUploadSpinner" class="btn-text">Upload</span>
                        </button>
                    </div>
                </div>
                <div class="row form-group">
                </div>
            </div>
        </form>
    </div>
</ng-template>
<ng-template #filterPopup let-c="close" let-d="dismiss">
    <div class="modal-header">
        <h4 class="modal-title popup-header-txt" id="myModalLabel2">Filter</h4>
        <button type="button" class="close" aria-label="Close" (click)="closeEmpPopup()">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    <form [formGroup]="filterData" (ngSubmit)="filterList(filterData)" autocomplete="off" class="needs-validation">
        <div class="modal-body p-2" style="height: calc(100vh - 14vh);">
            <perfect-scrollbar>
                <div class="row m-b-0">
                    <label for="opt" class="col-sm-12 col-form-label filter-label">Plant</label>
                    <div class="col-sm-12">
                        <ng-multiselect-dropdown name="branchId"
                            class="custom-multiSelection assessmentdropDown customWidthForRport"
                            [placeholder]="'Select Plant'" [settings]="SingleDropdownSettings"
                            formControlName="branchId" [data]="branchAccessList" [disabled]="false">
                        </ng-multiselect-dropdown>
                    </div>
                </div>
                <div class="row m-b-0">
                    <label for="opt" class="col-sm-12 col-form-label filter-label">Department</label>
                    <div class="col-sm-12">
                        <ng-multiselect-dropdown name="opt"
                            class="custom-multiSelection assessmentdropDown customWidthForRport"
                            [placeholder]="'Select option'" [settings]="multipleDropdownSettings" [data]="deptList">
                        </ng-multiselect-dropdown>
                    </div>
                </div>
            </perfect-scrollbar>
        </div>
        <div class="modal-footer footerBlock text-right">
            <button class="btn submitBtn event-btn" type="submit">
                <span *ngIf="submitSpinner" class="spinner-grow spinner-grow-sm" role="status"></span>
                <span *ngIf="submitSpinner" class="load-text"> Loading...</span>
                <span *ngIf="!submitSpinner" class="btn-text">Apply Filter</span>
            </button>
            <button type="button" class="btn cancelBtn" aria-label="Close" (click)="d('Cross click')">Cancel
            </button>
        </div>
    </form>
</ng-template>

<ng-template #certificateModalForSettings let-c="close">
    <app-viewCertificate [close]="c" [selectedDet]="selectedRecForModal"></app-viewCertificate>
</ng-template>
