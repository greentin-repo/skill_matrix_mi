<div class="homepage-block bg-Transperant p-l-15 p-r-15">
    <div class="extraContent">
        <div class="row m-0">
            <div class="col-8 p-0">
                <div class="row m-0">
                    <div class="col-6">
                        <!-- <div class="form-group has-search">
                            <span class="fa fa-search form-control-feedback"></span>
                            <input type="text" class="form-control" name="searchInput" placeholder="Search"> -->
                        <!-- [(ngModel)]="searchDet.searchInput" -->
                        <!-- </div> -->


                        <div class="form-group has-search">
                            <span class="fa fa-search form-control-feedback" (click)="getSearchList(true)"
                                *ngIf="!searchDet.searchData"></span>
                            <span *ngIf="searchDet.searchData" class="fa fa-times-circle form-control-clear"
                                (click)="getSearchList(false)"></span>

                            <input type="text" class="form-control" id="your-element-id" name="searchInput"
                                placeholder="Search by gap reason or plant name" [(ngModel)]="searchDet.searchInput"
                                (keyup)="$event.keyCode == 13 ? getSearchList(true) : ''" autocomplete="off"
                                style="padding-right: 2.4rem;" />
                        </div>
                    </div>

                    <div class="col-6 p-r-5 p-l-5">
                        <!-- <div class="form-group m-0">
                            <label for="branch" class="col-form-label1" style="top: 11px;">Plant</label>
                            <div class="">
                                <ng-multiselect-dropdown name="branch" id="branch"
                                    class="custom-multiSelection customWidthForInter assessmentdropDown addLabelInside"
                                    [placeholder]="'Select Plant'" [settings]="SingleBranchDropdownSettings"
                                    (onSelect)="onChangeBranch($event)" (onDeSelect)="onChangeBranch(false)"
                                    [data]="branchAccessList" [(ngModel)]="searchDet.branchId">
                                </ng-multiselect-dropdown>
                            </div>
                        </div> -->
                   <!-- referenceGapReason.branch -->

                    </div>
                </div>
            </div>
            <div class="col-4 p-0">
                <div class="addRegDiv">
                    <button class="btn addRegBtn m-0" type="button"
                        (click)="openRefGapReasonModal(openRefModalGapReason, 'top')" [disabled]="!disableReferGap">
                        <i class="fa fa-plus m-r-10"></i> Add Gap Reason</button>
                </div>
            </div>
        </div>
    </div>
    <app-loading *ngIf="isGapListLoading" style="position: absolute;top: 50%;left: 50%;">Please Wait...</app-loading>
    <div class="table-block">
        <div class="table-responsive tableFixHead">
            <table class="table" matSort (matSortChange)="sortData($event)">
                <thead>
                    <tr>
                        <th mat-sort-header="BranchName">Plant</th>
                        <th mat-sort-header="Reason">Gap Reason</th>
                        <th mat-sort-header="CreatedDate">Created Date</th>
                        <th class="actionTh fixedColumn">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let x of refGapReasonList">

                        <td>{{x.branchName}}</td>
                        <td>{{x.reason}}</td>
                        <td>{{(x.createdDate) ? (x.createdDate | date:'dd-MM-yyyy') : 'N/A'}}</td>
                        <td class="actionTd size text-left">
                            <i class="fa fa-edit editIcon"
                                (click)="updateRefGapReason(openRefModalGapReason, 'top', x)">
                            </i>&nbsp; &nbsp;
                            <i class="fas fa-trash-alt deleteIcon" (click)="removeRefGapReason(x)">
                            </i>&nbsp; &nbsp;
                        </td>
                    </tr>
                    <tr *ngIf="(refGapReasonList == null || refGapReasonList.length == 0)">
                        <td colspan="2" class="text-center no-record-found" *ngIf="!isGapListLoading">
                            <!-- *ngIf="!listLoading" -->
                            Data not found
                        </td>
                        <td colspan="2" class="text-center loading-div" *ngIf="isGapListLoading">
                            <app-loading></app-loading>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <app-pagination [staticPagination]="staticPagination" (paginationData)="loadMore($event)"></app-pagination>
    </div>
</div>
<ng-template #openRefModalGapReason let-c="close" let-d="dismiss">
    <div class="modal-header">
        <h4 class="modal-title" id="myModalLabel2">{{modalTitle}}</h4>
        <button type="button" class="close" aria-label="Close" (click)="d('Cross click')">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    <form [formGroup]="formdata" (ngSubmit)="saveReferenceGapReason(formdata)" autocomplete="off">
        <div class="modal-body p-0">
            <!-- <div>
                <div class="form-group row">
                    <label for="branch" class="col-sm-4 col-form-label">Plant &nbsp;
                        <span class="astrik">*</span>
                    </label>
                    <div class="col-8 p-l-7">

                        <ng-multiselect-dropdown name="branch" class="custom-multiSelection customWidthForInter"
                            [placeholder]="'Select Plant'" [settings]="SingleBranchDropdownSettings"
                            formControlName="branch" [data]="branchAccessList" [disabled]="false"
                            [(ngModel)]="addEditReferenceGapReason.branch">
                        </ng-multiselect-dropdown>
                        <div *ngIf="isFormSubmitted && formdata.controls['branch'].invalid || 
                        (formdata.controls['branch'].touched || formdata.controls['branch'].Untouched) 
                        && formdata.controls['branch'].hasError('required')" class="custom-errorMsg" style="padding-left: 15px;">
                            Please select plant
                        </div>
                    </div>
                </div>
            </div> -->
            <div class="row form-group">
                <label for="gapReason" class="col-sm-4 col-form-label">Gap Reason &nbsp;
                    <span class="astrik">*</span>
                </label>
                <div class="col-sm-8">
                    <input type="text" id="gapReason" name="gapReason" placeholder="Enter gap reason"
                        formControlName="gapReason" [(ngModel)]="addEditReferenceGapReason.gapReason"
                        class="form-control customInput-field" maxlength="255" />
                    <div *ngIf="isFormSubmitted && formdata.controls['gapReason'].invalid || 
                            (formdata.controls['gapReason'].touched || formdata.controls['gapReason'].Untouched) 
                            && formdata.controls['gapReason'].hasError('required')" class="custom-errorMsg">
                        Please enter gap reason
                    </div>
                </div>
            </div>
        </div>
        <div class="footerDiv"></div>
        <div class="footerBtn">
            <button class="btn btn-lg submitBtn event-btn" type="submit" [disabled]="submitSpinner">
                <span *ngIf="submitSpinner" class="spinner-grow spinner-grow-sm" role="status"></span>
                <span *ngIf="submitSpinner" class="load-text"> Loading...</span>
                <span *ngIf="!submitSpinner" class="btn-text">Submit</span>
            </button>
        </div>
    </form>
</ng-template>
