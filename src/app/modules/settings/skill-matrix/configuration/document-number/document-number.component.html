
<div class="homepage-block bg-Transperant p-l-15 p-r-15">
    <div class="extraContent">
        <div class="row m-0">
            <!-- style="height: 40px;" -->
            <div class="col-8 p-0">
                <div class="row m-0">
                    <div class="col-6">
                        <div class="form-group has-search" >
                            <span  class="form-control-feedback"
                               ></span>
                            <input type="text" class="form-control" />
                        </div>
                    </div>
                    <div class="col-6 p-r-5 p-l-5">
                    </div>
                </div>
            </div>
            <div class="col-4 p-0" >
                <div class="addRegDiv">
                    <button class="btn addRegBtn m-0" type="button"
                        (click)="addRefShiftNoOpen(openRefModalShiftNo, 'top')" >
                        <i class="fa fa-plus m-r-10"></i> Add Document</button>
                </div>
            </div>
        </div>
        <div class="table-block">
            <div class="table-responsive tableFixHead">
                <table datatable class="table">
                    <thead>
                        <tr>
                            <th class>Document Number</th>
                            <th class="actionTh fixedColumn">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let Doc of documentList">
                            <td>
                                <span *ngIf="!Doc.isEditable">{{ Doc.docName}}</span>
                                <input *ngIf="Doc.isEditable  && Doc.id === currentlyEditedDocumentId" type="text" class="form-control my-custom-input"
                                    name="searchInput" [class.editing]="Doc.isEditable" #DocInputField
                                    placeholder="Enter Doc name" [(ngModel)]="Doc.docName" autocomplete="off" />
                                <span class="custom-errorMsg" *ngIf="isShowDocError && !Doc.docName">Please
                                    enter document name</span>
                            </td>
                            <td class="actionTd size text-left">
                                <i *ngIf="!Doc.isEditable" class="fa fa-edit editIcon" (click)="toggleEdit(Doc)"></i>&nbsp;&nbsp;&nbsp;
                                <i *ngIf="!Doc.isEditable" class="fas fa-trash-alt deleteIcon" (click)="deleteDocument(Doc)"></i>
                                <ng-container *ngIf="Doc.isEditable && Doc.id === currentlyEditedDocumentId">
                                    <button class="btn btn-primary updateButton"
                                        (click)="updateDocumentNumber(Doc)">Save</button>&nbsp;
                                    <button class="btn btn-danger cancelButton" (click)="cancelEdit(Doc)">Cancel</button>
                                </ng-container>
                            </td>                   
                        </tr>
                        <tr *ngIf="(documentList == null || documentList.length == 0)">
                            <td colspan="11" class="text-center no-record-found" *ngIf="!listLoading">
                                Data not found
                            </td>
                            <td colspan="11" class="text-center loading-div" *ngIf="listLoading">
                                <app-loading></app-loading>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
     <!-- Aniket :- Show document list  -->

</div>
<!--   Aniket :- Show Add modal -->
<ng-template #openRefModalShiftNo let-c="close" let-d="dismiss">
    <div class="modal-header">
        <h4 class="modal-title" id="myModalLabel2">{{modalTitle}}</h4>
        <button type="button" class="close" aria-label="Close" (click)="d('Cross click')">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    <form [formGroup]="formdata" (ngSubmit)="saveDocument(formdata)" autocomplete="off">
        <div class="modal-body p-0">
            <div>                
                <div class="row form-group">
                    <label for="docName" class="col-sm-4 col-form-label">Document Number
                        <span class="astrik">*</span>
                    </label>
                    <div class="col-sm-8">
                        <input type="text" id="docName" name="docName" placeholder="Enter Document Number"
                            formControlName="docName" [(ngModel)]="addEditReferenceDocName.doc"
                            class="form-control customInput-field" maxlength="255" />
                        <div *ngIf="isFormSubmitted && formdata.controls['docName'].invalid || 
                            (formdata.controls['docName'].touched || formdata.controls['docName'].Untouched) 
                            && formdata.controls['docName'].hasError('required')" class="custom-errorMsg">
                            Please enter document number
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="footerDiv"></div>
        <div class="footerBtn">
            <button class="btn btn-lg submitBtn event-btn" type="submit" [disabled]="submitSpinner">
                <span *ngIf="submitSpinner" class="spinner-grow spinner-grow-sm" role="status"></span>
                <span *ngIf="submitSpinner" class="load-text"> Loading...</span>
                <span *ngIf="!submitSpinner" class="btn-text">Submit</span>
            </button>
        </div>
    </form>
</ng-template>
