<div class="homepage-block bg-Transperant p-l-15 p-r-15">
    <div class="extraContent">
        <div class="row m-0">

            <div class="col-3 p-r-5 p-l-5 m-l-2">
            </div>

            <div class="col-3 p-r-5 p-l-5 form-group">

            </div>
            <div class="col-4 p-0">

            </div>
        </div>
    </div>

    <!-- TABLE BLOCK -->
    <div class="table-block">
        <div class="table-responsive tableFixHead">
            <table datatable class="table">
                <thead>
                    <tr>
                        <th class="fixedColumn">Stage</th>
                        <th class>Stage Label</th>
                        <th class="actionTh fixedColumn">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let stage of stageList">
                        <td *ngIf="stage.stageCaption != 'Stage7'">{{stage.stageName}}</td>
                        <td *ngIf="stage.stageCaption != 'Stage7'">
                            <span *ngIf="!stage.isEditable">{{ stage.stageLabel}}</span>
                            <input *ngIf="stage.isEditable  && stage.stageId === currentlyEditedStageId" type="text" class="form-control my-custom-input"
                                name="searchInput" [class.editing]="stage.isEditable" #stageInputField
                                placeholder="Enter stage name" [(ngModel)]="stage.stageLabel" autocomplete="off" />
                            <span class="custom-errorMsg" *ngIf="isShowStageError && !stage.stageLabel">Please
                                enter stage name</span>

                        </td>

                        <td class="actionTd size text-left" *ngIf="stage.stageCaption != 'Stage7'">
                            <i *ngIf="!stage.isEditable" class="fa fa-edit editIcon" (click)="toggleEdit(stage)"></i>
                            <ng-container *ngIf="stage.isEditable && stage.stageId === currentlyEditedStageId">
                                <button class="btn btn-primary updateButton"
                                    (click)="updateStageLabel(stage)">Save</button>&nbsp;
                                <button class="btn btn-danger cancelButton" (click)="cancelEdit(stage)">Cancel</button>
                            </ng-container>
                        </td>
                    </tr>
                    <tr *ngIf="(stageList == null || stageList.length == 0)">
                        <td colspan="11" class="text-center no-record-found" *ngIf="!listLoading">
                            Data not found
                        </td>
                        <td colspan="11" class="text-center loading-div" *ngIf="listLoading">
                            <app-loading></app-loading>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>
</div>
