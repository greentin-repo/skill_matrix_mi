<div class="row m-0">
    <div class="col-8 m-auto">

    <div class="col-3 m-auto">

    </div>
    <div class="col-1 p-0 m-auto text-center">

            <i class="fa fa-filter filter-icon" aria-hidden="true"></i>
        </button> -->
        <div class="btn-filter-wrap">
            <button class="btn btn-default filter-btn" [ngClass]="{'applied' : searchDet.filterFlag}" title="Filter" (click)="filterModalOpen(filterPopup)">
                <i class="fa fa-filter filter-icon" aria-hidden="true"></i>
            </button>
            <div class="btn-clear-filter" *ngIf="searchDet.filterFlag" (click)="removeFilter();">x</div>
            <div class="lbl-filter-applied" *ngIf="searchDet.filterFlag">Filter Applied</div>
        </div>
    </div>
</div>
        <div class="homepage-block bg-Transperant p-l-15 p-r-15"> 
            <div class="extraContent">
                <div class="row m-0">
                    <div class="p-l-0 p-r-5 col-4">
                        <div class="row m-0">
                            <!-- <div class="p-l-0 p-r-5" [ngClass]="(searchDet.filterFlag)?'col-6':'col-12'"> -->
                            <div class="col-12">
                                <div class="form-group has-search">
                                    <span *ngIf="!searchDet.searchData" class="fa fa-search form-control-feedback" (click)="getSearchList(true)"></span>
                                    <span *ngIf="searchDet.searchData" class="fa fa-times-circle form-control-clear"
                                    (click)="getSearchList(false)"></span>                                    
                                    <input type="text" class="form-control" name="searchInput" placeholder="Search by workstation"
                                    [(ngModel)]="searchDet.searchInput" (keyup)="$event.keyCode == 13 ? getSearchList(true) : ''"/>
                                </div>
                            </div>
                            <!-- <div class="col-6 p-r-5 p-l-5" *ngIf="searchDet.filterFlag">
                                <div class="filterDiv">
                                    <button class="clearFilter" (click)="removeFilter()">Clear filter</button>
                                    &nbsp;
                                    <span style="color: green;font-size: 12px; font-weight: 500;">Filter
                                        Applied</span>
                                </div>
                            </div> -->
                        </div>
                    </div>
                    <div class="col-4 p-r-5 p-l-5 form-group">
        
                    </div>
                    <!-- <div class="col-4 p-0">
                        <div class="addRegDiv" style="bottom: -0.1rem;">
                            <button class="btn addRegBtn m-0" type="button"><i
                                    class="fa fa-plus m-r-10"></i>Add Certificate</button>
                        </div>
                    </div> -->
                </div>
            </div>
    <!-- TABLE BLOCK -->
    <div class="table-block">
        <div class="table-responsive tableFixHead">
            <table datatable class="table" matSort (matSortChange)="sortData($event)">
                <thead>
                    <tr>
                        <th mat-sort-header="BranchName" class>Plant</th>
                        <th mat-sort-header="DeptName" class>Department</th>
                        <th mat-sort-header="LineName" class>Cell/Line</th>
                        <th mat-sort-header="Workstation"class>Workstation</th>
                        <th mat-sort-header="LevelName" class>Level</th>
                        <th mat-sort-header="LevelName" class>Created On</th>
                        <th class="actionTh fixedColumn">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let data of certificateList">
                        <td>{{data.branchName}}</td>
                        <td>{{data.deptName}}</td>
                        <td>{{data.lineName}}</td>
                        <td>{{data.workstationName}}</td>
                        <td>{{data.levelName}}</td>
                        <td>{{data.createdDate | date:'dd-MM-yyyy'}}</td>
                        <td class="actionTd fixedColumn text-left">
                            <a  (click)="previewCertificate(data,certificateForMySkilling)" style="color:#7044CD;cursor: pointer"><i class="fa fa-eye viewIcon"></i></a>
                                &nbsp; &nbsp;
                            <!-- <a style="color:#7044CD;cursor: pointer;" href="{{data.certificatePath}}" download target="_blank"><i class="fa fa-download"></i></a> -->
                        </td>
                    </tr>
                    <tr *ngIf="(certificateList == null || certificateList.length == 0)">
                        <td colspan="11" class="text-center no-record-found" *ngIf="!listLoading">
                            Data Not Found                   
                             </td>
                        <td colspan="11" class="text-center loading-div" *ngIf="listLoading">
                            <app-loading></app-loading>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <app-pagination
        [staticPagination]="staticPagination"
        (paginationData)="loadMore($event)">
    </app-pagination>
</div>

<ng-template #certificateForMySkilling let-c="close">
    <app-viewCertificate [close]="c" [selectedDet]="selectedRecForModal"></app-viewCertificate>
</ng-template>

<ng-template #filterPopup let-c="close" let-d="dismiss">
    <div class="modal-header">
        <h4 class="modal-title popup-header-txt" id="myModalLabel2">Filter</h4>
        <button type="button" class="close" aria-label="Close" (click)="closeFilterPopup()">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>
    <form [formGroup]="filterFormData" (ngSubmit)="submitFilterForm(filterFormData)" autocomplete="off" class="needs-validation">
        <div class="modal-body p-2" style="height: calc(100vh - 14vh);">
            <perfect-scrollbar>
                <div class="row m-b-0">
                    <label for="branch" class="col-sm-12 col-form-label filter-label">Plant</label>
                    <div class="col-sm-12">
                        <ng-multiselect-dropdown name="branch" id="branch"
                            class="custom-multiSelection assessmentdropDown customWidthForRport"
                            [placeholder]="'Select Plant'" [settings]="SingleDropdownSettings" formControlName="branch"
                            [data]="getSortFunction(branchAccessList,'plant')" [disabled]="false" [(ngModel)]="selectedBranch.branch"
                            (onSelect)="onChangeBranch($event)">
                        </ng-multiselect-dropdown>
                        <div *ngIf="submitAttempted  && filterFormData.controls['branch'].invalid && (filterFormData.controls['branch'].touched || filterFormData.controls['branch'].dirty)"
                            class="custom-errorMsg" style="padding-left: 15px;">
                            <div *ngIf="filterFormData.controls['branch'].errors.required">
                                Please select plant
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row m-b-0">
                    <label for="opt" class="col-sm-12 col-form-label filter-label">Department</label>
                    <div class="col-sm-12">
                        <ng-multiselect-dropdown name="dept" id="dept"
                            class="custom-multiSelection assessmentdropDown customWidthForRport"
                            [placeholder]="'Select Department'" [settings]="multipleDropdownSettings" formControlName="dept"
                            [data]="getSortFunction(deptList,'dept')" [disabled]="false" [(ngModel)]="selectedBranch.dept">
                        </ng-multiselect-dropdown>
                        <div *ngIf=" submitAttempted  && filterFormData.controls['dept'].invalid && (filterFormData.controls['dept'].touched || filterFormData.controls['dept'].dirty)"
                            class="custom-errorMsg"  style="padding-left: 15px;">
                            <div *ngIf="filterFormData.controls['dept'].errors.required">
                                Please select department
                            </div>
                        </div>
                    </div>
                </div>
            </perfect-scrollbar>
        </div>
        <div class="modal-footer footerBlock text-right">
            <button class="btn submitBtn event-btn" type="submit">
                <span *ngIf="submitSpinner" class="spinner-grow spinner-grow-sm" role="status"></span>
                <span *ngIf="submitSpinner" class="load-text"> Loading...</span>
                <span *ngIf="!submitSpinner" class="btn-text">Apply Filter</span>
            </button>
            <button type="button" class="btn cancelBtn" aria-label="Close" (click)="closeFilterPopup()">Cancel
            </button>
        </div>
    </form>
</ng-template>
