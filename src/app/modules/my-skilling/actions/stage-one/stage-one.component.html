<div class="modal-dialog modal-sm" role="document">
    <div class="modal-content" style="height: calc(100vh - 7%);">
        <div *ngIf="submitLoading">
            <app-loading></app-loading>
        </div>
        <div class="modal-body p-t-0 p-b-0" style="padding: 0;">
            <div [style.height]="'calc(100vh - 38vh)'">
                <div class="row modal-header stage-header">
                    <div class="col-11">
                        <div class="main-tab-switcher">
                            <div class="main-tab-switch" [ngClass]="{'active':isSetMainTab(1)}" (click)="setMainTab(1)">
                                <span>Training</span>
                            </div>
                        </div>
                    </div>
                    <div class="col-1">
                        <button type="button" class="close" (click)="closeModal()">
                            <span>×</span>
                        </button>
                    </div>
                </div>
                <div style="height: calc(100vh - 12%);">
                    <div class="table-block">
                        <div class="table-responsive tableFixHead">
                            <table class="table" matSort (matSortChange)="sortData($event)">
                                <thead>
                                    <tr>
                                        <th mat-sort-header="DayNo" class="fixedColumn" style="text-align: center;">Day
                                        </th>
                                        <th mat-sort-header="date" class="">Date</th>
                                        <th mat-sort-header="keyPoint" class="">Key Point</th>
                                        <th mat-sort-header="Ref" class="">Reference</th>
                                        <th mat-sort-header="Ref" class="fixedColumn"
                                            *ngIf="actionDet.status == 'COMPLETED'">Status</th>
                                        <th class="fixedColumn p-0" *ngIf="actionDet.status != 'COMPLETED'">
                                            <select style="width: 100%; border: none;"
                                                class="custom-selectField form-control"
                                                [(ngModel)]="searchDet.masterSelected"
                                                (change)="onChangeCompleteAll($event)"
                                                [disabled]="actionDet.status == 'COMPLETED'">
                                                <option value="">Select Status</option>
                                                <option value="{{opt.id}}" *ngFor="let opt of constant.ACTION_LIST">
                                                    {{'All '+opt.name}}</option>
                                            </select>
                                        </th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr *ngFor="let item of trainingProdDetails.auditPointList">
                                        <td>{{item.dayNo || ''}}</td>
                                        <td>{{item.assignedDate | date: 'dd-MM-yyyy'}}</td>
                                        <td>{{item.keyPoint || ''}}</td>
                                        <td>{{item.reference || ''}}</td>
                                        <td class="fixedColumn completed" *ngIf="this.actionDet.status == 'COMPLETED'">
                                            {{this.actionDet.status}}
                                        </td>
                                        <td class="fixedColumn p-0 " *ngIf="actionDet.status != 'COMPLETED'">
                                            <select class="custom-selectField form-control"
                                                style="width: 100%; border: none;"
                                                (change)="onChangeComplete($event, item)"
                                                [(ngModel)]="item.selectedStatus"
                                                [disabled]="actionDet.status == 'COMPLETED'">
                                                <!-- *ngIf="enableSelectStatusOption(item.assignedDate)" -->
                                                <option value="">Select Status</option>
                                                <option value="{{opt.id}}" *ngFor="let opt of constant.ACTION_LIST">
                                                    {{opt.name}}</option>
                                            </select>
                                        </td>
                                    </tr>
                                    <tr
                                        *ngIf="(trainingProdDetails.auditPointList == null || trainingProdDetails.auditPointList.length == 0)">
                                        <td colspan="11" class="text-center no-record-found" *ngIf="!listLoading">
                                            Data Not Found
                                        </td>
                                        <td colspan="11" class="text-center loading-div" *ngIf="listLoading">
                                            <app-loading></app-loading>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="modal-footer paginationFooter">
            <div class="row m-0">
                <div class="col-9 p-0" style="display: inline-flex;">
                    <!-- <div class="form-group m-0 row"> col-sm-2-->
                        <label for="comment" class="col-form-label" style="margin-right: 10px;display: contents;">Comment <span class="astrik">*  </span> </label>
                        <!-- <div class="col-sm-10"> -->
                            <!-- <input type="text" placeholder="Comment" id="comment" name="comment"
                                class="custom-inputField" [(ngModel)]="trainingProdDetails.comment"
                                [disabled]="actionDet.status == 'COMPLETED'" /> -->
                                <textarea class="form-control textarea-custom" id="comment" name="comment" [(ngModel)]="trainingProdDetails.comment" rows="2"  placeholder="Comment" [disabled]="actionDet.status == 'COMPLETED'" [maxlength]="1000"></textarea>
                        <!-- </div> -->
                    <!-- </div> -->
                </div>
                <div class="col-3 text-right">
                    <ng-container *ngIf="actionDet.status == 'PENDING'">
                        <button type="button" class="btn submitBtn" (click)="submitStatus()"
                            [ngClass]="{'disable-btn' : enableCompletedBtn === false}">Submit</button>
                    </ng-container>
                    <button type="button" class="btn cancelBtn" (click)="closeModal()"
                        style="margin-left: 10px;">Cancel</button>
                </div>
            </div>
        </div>
    </div>
</div>
