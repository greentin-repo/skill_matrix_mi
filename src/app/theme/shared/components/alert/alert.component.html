 <div class="backPage" *ngIf="alerts != null && alerts.length > 0"></div>
<div *ngFor="let alert of alerts" class="{{cssClass(alert)}} custom-Alert">
  <button type="button" class="close" (click)="removeAlert(alert)">&times;</button>
  <span [innerHTML]="alert.message"></span>
</div>
